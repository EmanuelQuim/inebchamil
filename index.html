<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Odisea de Pipo - El Juego</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e3fafc;
            color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .sprite {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        h1 { color: #0c8599; margin-bottom: 10px; }
        p { font-size: 1.1rem; line-height: 1.6; }
        .stats {
            background: #f1f3f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-around;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #1098ad;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0c8599; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="sprite" id="game-icon">🐧</div>
    <h1 id="game-title">La Odisea de Pipo</h1>
    
    <div class="stats">
        <span>🐟 Peces: <span id="fish-count">0</span>/5</span>
        <span>❤️ Vida: <span id="life-count">100</span>%</span>
    </div>

    <p id="game-text">Estás en el acantilado. Tu polluelo tiene hambre. Debes bajar al mar a pescar, pero la gaviota Goliath vigila el cielo.</p>
    
    <div class="btn-container" id="choices">
        <!-- Los botones cambiarán dinámicamente -->
    </div>
</div>

<script>
    // Variables de estado del juego
    let fish = 0;
    let life = 100;
    
    const gameText = document.getElementById("game-text");
    const fishCount = document.getElementById("fish-count");
    const lifeCount = document.getElementById("life-count");
    const choicesContainer = document.getElementById("choices");
    const gameIcon = document.getElementById("game-icon");

    // Estructura de la historia (Nodos del juego)
    const story = {
        inicio: {
            text: "Estás al borde del acantilado de Islandia. Abajo está el océano lleno de deliciosos lanzones (peces). La gran gaviota Goliath patrulla el cielo. ¿Cómo bajas?",
            icon: "🐧",
            options: [
                { text: "🪂 Lanzarte en picado directo al mar", next: "mar_directo" },
                { text: "👥 Camuflarte entre el grupo de frailecillos", next: "esperar" }
            ]
        },
        mar_directo: {
            text: "¡Zas! Vuelas a toda velocidad. Goliath te ve pero eres demasiado rápido y te sumerges en el agua. ¡Estás a salvo bajo el mar y ves un banco de peces!",
            icon: "🌊",
            options: [
                { text: "🐟 Atrapar 3 peces rápido", next: "pesca_rapida" },
                { text: "🦞 Buscar en el fondo un cangrejo grande", next: "cangrejo" }
            ]
        },
        esperar: {
            text: "Te quedas con tus amigos haciendo 'orrr-orrr'. Goliath se aburre y se va a molestar a otros. Bajas al agua tranquilamente.",
            icon: "⛰️",
            options: [
                { text: "🐟 Empezar a pescar con calma", next: "pesca_calma" }
            ]
        },
        pesca_rapida: {
            text: "¡Éxito! Atrapas 3 peces y los acomodas de lado en tu pico. Al salir a la superficie, Goliath te acecha en el aire. ¡Debes volver a la madriguera!",
            icon: "🐟",
            action: () => { fish = 3; updateStats(); },
            options: [
                { text: "🚀 Volar en zigzag hacia el nido", next: "final_bueno" },
                { text: "🏖️ Esconderte en una roca de la playa", next: "playa_peligro" }
            ]
        },
        cangrejo: {
            text: "El cangrejo era muy fuerte y te pellizca el ala. Pierdes 40 de vida, pero logras salir a la superficie con un pez.",
            icon: "🦀",
            action: () => { life -= 40; fish = 1; updateStats(); },
            options: [
                { text: "🏠 Volar a casa herido", next: "final_ajustado" }
            ]
        },
        pesca_calma: {
            text: "Pescando con calma logras llenar tu pico con 5 peces (¡el máximo!). Estás listo para el regreso perfecto.",
            icon: "🐟",
            action: () => { fish = 5; updateStats(); },
            options: [
                { text: "🦅 Volar directo al acantilado", next: "final_perfecto" }
            ]
        },
        playa_peligro: {
            text: "Un zorro ártico te esperaba en la playa. ¡Tuviste que escapar soltando los peces!",
            icon: "🦊",
            action: () => { fish = 0; updateStats(); },
            options: [
                { text: "🔄 Volver a intentarlo", next: "inicio" }
            ]
        },
        final_bueno: {
            text: "¡Esquivas a Goliath con tus maniobras aéreas y llegas a la madriguera! Tu polluelo cena feliz sus 3 peces. ¡Ganaste!",
            icon: "🐥",
            options: [{ text: "🎮 Jugar de nuevo", next: "reiniciar" }]
        },
        final_perfecto: {
            text: "¡Increíble! Llegaste con el pico lleno (5 peces). Tu polluelo crecerá fuerte y sano. ¡Eres el rey de los frailecillos! 🏆",
            icon: "👑",
            options: [{ text: "🎮 Jugar de nuevo", next: "reiniciar" }]
        },
        final_ajustado: {
            text: "Llegas cansado y herido por el cangrejo, pero tu polluelo come hoy. ¡Lograste sobrevivir a duras penas!",
            icon: "🩹",
            options: [{ text: "🎮 Jugar de nuevo", next: "reiniciar" }]
        }
    };

    function updateStats() {
        fishCount.textContent = fish;
        lifeCount.textContent = life;
    }

    function goToScene(sceneKey) {
        if (sceneKey === "reiniciar") {
            fish = 0;
            life = 100;
            updateStats();
            sceneKey = "inicio";
        }

        const scene = story[sceneKey];
        gameText.textContent = scene.text;
        gameIcon.textContent = scene.icon;

        if (scene.action) {
            scene.action();
        }

        // Limpiar opciones anteriores
        choicesContainer.innerHTML = "";

        // Crear nuevos botones de opción
        scene.options.forEach(option => {
            const button = document.createElement("button");
            button.textContent = option.text;
            button.onclick = () => goToScene(option.next);
            choicesContainer.appendChild(button);
        });
    }

    // Iniciar el juego
    goToScene("inicio");
</script>

</body>
</html>
